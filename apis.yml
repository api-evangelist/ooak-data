name: Ooak Data
description: >-
  Ooak Data is an applied AI research lab building the data infrastructure for
  frontier AI. It turns real company data into reinforcement-learning
  environments where AI agents learn to work in the real world — sourcing
  multimodal enterprise data, anonymizing it into digital twins of tools like
  Slack, Gmail, Notion and Jira, and generating expert-calibrated, multi-step,
  multi-tool workflow tasks calibrated on the latest frontier models. It serves
  frontier AI labs, enterprise AI teams, and AI startups that need real-world
  evaluation infrastructure rather than synthetic benchmarks. Backed by Y
  Combinator (Summer 2026) and based in Paris, France. Ooak Data publishes
  research essays and an AI-friendly content surface (llms.txt + Markdown
  content negotiation) but does not currently expose a public API or developer
  platform.
